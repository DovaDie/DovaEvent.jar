
name: Build DovaEvent

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find source
        run: |
          if [ -f build.gradle ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          elif [ -f DovaEvent-GitHub-Source.zip ]; then
            unzip DovaEvent-GitHub-Source.zip -d source
            echo "BUILD_DIR=source" >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
            if [ -n "$ZIP" ]; then
              unzip "$ZIP" -d source
              echo "BUILD_DIR=source" >> "$GITHUB_ENV"
            else
              echo "Khong tim thay source hoac ZIP"
              ls -la
              exit 1
            fi
          fi

      - name: Build plugin
        run: gradle -p "$BUILD_DIR" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DovaEvent-1.0.0
          path: ${{ env.BUILD_DIR }}/build/libs/DovaEvent-1.0.0.jar
